name: Build

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        description: 'Version tag (e.g. v1.21p99) to embed in binary'

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install packages
        run: sudo apt-get -y update && sudo apt-get -y install build-essential gcc-i686-linux-gnu g++-i686-linux-gnu
      - name: Parse patch version
        id: ver
        if: inputs.version
        env:
          VERSION_TAG: ${{ inputs.version }}
        run: |
          PATCH=$(echo "$VERSION_TAG" | sed -n 's/^v[0-9]*\.[0-9]*p0*\([0-9]\+\)$/\1/p')
          if [ -z "$PATCH" ]; then
            echo "::error::Failed to parse patch version from '$VERSION_TAG'"
            exit 1
          fi
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y/%m/%d)" >> "$GITHUB_OUTPUT"
      - name: Build metamod (debug)
        run: make -j4 -C metamod CC="i686-linux-gnu-gcc" ${{ steps.ver.outputs.patch && format('META_VERSION={0} META_DATE={1}', steps.ver.outputs.patch, steps.ver.outputs.date) || '' }}
      - name: Build metamod (optimized)
        run: make -j4 -C metamod CC="i686-linux-gnu-gcc" OPT=opt ${{ steps.ver.outputs.patch && format('META_VERSION={0} META_DATE={1}', steps.ver.outputs.patch, steps.ver.outputs.date) || '' }}
      - name: Build trace_plugin (optimized)
        run: make -j4 -C trace_plugin CC="i686-linux-gnu-gcc" OPT=opt
      - name: Build stub_plugin (optimized)
        run: make -j4 -C stub_plugin CC="i686-linux-gnu-gcc" OPT=opt
      - name: Build wdmisc_plugin (optimized)
        run: make -j4 -C wdmisc_plugin CC="i686-linux-gnu-gcc" OPT=opt
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-binaries
          path: |
            metamod/opt.linux_i386/metamod.so
            trace_plugin/opt.linux_i386/trace_mm.so
            stub_plugin/opt.linux_i386/stub_mm.so
            wdmisc_plugin/opt.linux_i386/wdmisc_mm.so

  build-linux-bionic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Parse patch version
        id: ver
        if: inputs.version
        env:
          VERSION_TAG: ${{ inputs.version }}
        run: |
          PATCH=$(echo "$VERSION_TAG" | sed -n 's/^v[0-9]*\.[0-9]*p0*\([0-9]\+\)$/\1/p')
          if [ -z "$PATCH" ]; then
            echo "::error::Failed to parse patch version from '$VERSION_TAG'"
            exit 1
          fi
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y/%m/%d)" >> "$GITHUB_OUTPUT"
      - name: Build in Ubuntu 18.04 i386 container
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace \
            lpenz/ubuntu-bionic-i386 \
            bash -c "apt-get -y update && apt-get -y install build-essential g++ make && \
              make -j4 -C metamod OPT=opt ${{ steps.ver.outputs.patch && format('META_VERSION={0} META_DATE={1}', steps.ver.outputs.patch, steps.ver.outputs.date) || '' }} && \
              make -j4 -C trace_plugin OPT=opt && \
              make -j4 -C stub_plugin OPT=opt && \
              make -j4 -C wdmisc_plugin OPT=opt"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-bionic-binaries
          path: |
            metamod/opt.linux_i386/metamod.so
            trace_plugin/opt.linux_i386/trace_mm.so
            stub_plugin/opt.linux_i386/stub_mm.so
            wdmisc_plugin/opt.linux_i386/wdmisc_mm.so

  build-windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install packages
        run: sudo apt-get -y update && sudo apt-get -y install gcc-mingw-w64 g++-mingw-w64
      - name: Parse patch version
        id: ver
        if: inputs.version
        env:
          VERSION_TAG: ${{ inputs.version }}
        run: |
          PATCH=$(echo "$VERSION_TAG" | sed -n 's/^v[0-9]*\.[0-9]*p0*\([0-9]\+\)$/\1/p')
          if [ -z "$PATCH" ]; then
            echo "::error::Failed to parse patch version from '$VERSION_TAG'"
            exit 1
          fi
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y/%m/%d)" >> "$GITHUB_OUTPUT"
      - name: Build metamod (optimized)
        run: make -j4 -C metamod CC_WIN="i686-w64-mingw32-g++" OS=windows OPT=opt win32 ${{ steps.ver.outputs.patch && format('META_VERSION={0} META_DATE={1}', steps.ver.outputs.patch, steps.ver.outputs.date) || '' }}
      - name: Build trace_plugin (optimized)
        run: make -j4 -C trace_plugin CC_WIN="i686-w64-mingw32-g++" OS=windows OPT=opt win32
      - name: Build stub_plugin (optimized)
        run: make -j4 -C stub_plugin CC_WIN="i686-w64-mingw32-g++" OS=windows OPT=opt win32
      - name: Build wdmisc_plugin (optimized)
        run: make -j4 -C wdmisc_plugin CC_WIN="i686-w64-mingw32-g++" OS=windows OPT=opt win32
      - name: Verify Win32 DLL exports and imports
        run: |
          pip install pefile
          python3 -u .github/scripts/check_dll.py \
            metamod/opt.win32/metamod.dll \
              GiveFnptrsToDll GetEntityAPI GetEntityAPI2 GetNewDLLFunctions \
            -- \
            trace_plugin/opt.win32/trace_mm.dll \
              GiveFnptrsToDll Meta_Query Meta_Attach Meta_Detach \
            -- \
            stub_plugin/opt.win32/stub_mm.dll \
              GiveFnptrsToDll Meta_Query Meta_Attach Meta_Detach \
            -- \
            wdmisc_plugin/opt.win32/wdmisc_mm.dll \
              GiveFnptrsToDll Meta_Query Meta_Attach Meta_Detach
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-binaries
          path: |
            metamod/opt.win32/metamod.dll
            trace_plugin/opt.win32/trace_mm.dll
            stub_plugin/opt.win32/stub_mm.dll
            wdmisc_plugin/opt.win32/wdmisc_mm.dll
